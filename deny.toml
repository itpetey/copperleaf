# Dependency policy for the Copperleaf workspace.
#
# `cargo deny check` enforces licences, security advisories, duplicate bans,
# and registry provenance. `cargo shear` separately rejects unused
# dependencies. Both run from the aggregate verification script and CI.

[advisories]
version = 2
yanked = "warn"
ignore = [
  # Scoped, review-dated exception: the PDF parsing stack pulled in by
  # `pdf-extract`/`lopdf` carries this advisory. The CLI only ever parses
  # locally supplied datasheets and never writes to the networks the advisory
  # concerns. Replacing the PDF stack is a separate maintenance change, and
  # this exception must be removed when that change lands.
  { id = "RUSTSEC-2026-0192", reason = "PDF parsing stack (pdf-extract/lopdf); scoped to local datasheet input, replacement tracked as a follow-up maintenance change" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
# Workspace dependencies are resolved through `[workspace.dependencies]` and
# inherit a single pinned requirement, so `workspace = true` is not a wildcard
# in the sense this check targets.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
