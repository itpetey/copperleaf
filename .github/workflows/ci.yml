name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - name: Install binary installer (cargo binstall)
        run: cargo install cargo-binstall
      - name: Install verification tools
        run: cargo binstall cargo-deny cargo-shear
      - name: Install OpenSpec
        run: npm install --global @fission-ai/openspec@1.15.0
      - name: Aggregate verification
        run: VERIFY_SKIP_KICAD=1 ./scripts/verify.sh
      - name: Check worktree is clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  kicad-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Emit representative project
        run: >-
          cargo run --locked -p copperleaf-backend-kicad
          --example w5500_acceptance -- target/kicad-acceptance
      - name: Run pinned KiCad acceptance
        # The image runs as uid 1000, which cannot write to the
        # runner-owned checkout. Copy the emitted project into the
        # container's scratch space and point the script at it.
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            -w /work \
            -e KICAD_ACCEPTANCE_SKIP_EMIT=1 \
            -e KICAD_ACCEPTANCE_WORKDIR=/tmp/kicad-acceptance \
            kicad/kicad@sha256:c8f05703e865a1caa7266851cf4986dd01d5fb1148e4f63382b6a73466ba7e71 \
            bash -lc 'cp -R target/kicad-acceptance /tmp/kicad-acceptance && ./scripts/kicad-acceptance.sh'
