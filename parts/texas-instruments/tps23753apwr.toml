model_3d_data = ""

[[pin]]
num = 1
number = "1"
name = "CTL"
purpose = "Control input"
notes = "Control loop input to the PWM. Use VB as a pull up for CTL; pulling VCTL below VZDC (~1.5 V) stops GATE switching. Input voltage range to RTN -0.3 to 6.5 V; input resistance 70-145 kOhm."
kind = "dio"
pos = [-2.87, -1.95]
rotation = 0.0
length = 1.57
width = 1.57
height = 0.41
pad_type = "smd"
pad_shape = "roundrect"
roundrect_rratio = 0.125
solder_mask_margin = 0.102
layers = "F.Cu F.Mask F.Paste"

[[pin]]
num = 2
number = "2"
name = "VB"
purpose = "Bias rail"
notes = "Internal 5 V bias rail for the dc/dc control circuits; bypass to RTN with a 0.1 uF capacitor. May be used to bias an external feedback optocoupler. Sourcing current 0-5 mA."
kind = "dio"
pos = [-2.87, -1.3]
rotation = 0.0
length = 1.57
width = 1.57
height = 0.41
pad_type = "smd"
pad_shape = "roundrect"
roundrect_rratio = 0.125
solder_mask_margin = 0.102
layers = "F.Cu F.Mask F.Paste"

[[pin]]
num = 3
number = "3"
name = "CS"
purpose = "Current sense"
notes = "Dc/dc converter switching MOSFET current-sense input; connect to the high side of RCS. Current-limit threshold VCSMAX 0.50-0.60 V; turn-off delay 25-60 ns."
kind = "dio"
pos = [-2.87, -0.65]
rotation = 0.0
length = 1.57
width = 1.57
height = 0.41
pad_type = "smd"
pad_shape = "roundrect"
roundrect_rratio = 0.125
solder_mask_margin = 0.102
layers = "F.Cu F.Mask F.Paste"

[[pin]]
num = 4
number = "4"
name = "VC"
purpose = "Bias supply"
notes = "Dc/dc converter bias voltage. The internal startup current source and the converter bias winding output power this pin; connect a 0.22 uF minimum ceramic capacitor to RTN. Input voltage range to RTN 0-18 V."
kind = "dio"
pos = [-2.87, 0.0]
rotation = 0.0
length = 1.57
width = 1.57
height = 0.41
pad_type = "smd"
pad_shape = "roundrect"
roundrect_rratio = 0.125
