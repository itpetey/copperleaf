[[pin]]
num = 5
number = "5"
name = "GATE"
purpose = "Gate drive"
notes = "Gate drive output for the dc/dc converter switching MOSFET. Source current 0.30-0.60 A; sink current 0.50-1.1 A."
kind = "dio"
pos = [-2.87, 0.65]
rotation = 0.0
length = 1.57
width = 1.57
height = 0.41
pad_type = "smd"
pad_shape = "roundrect"
roundrect_rratio = 0.125
solder_mask_margin = 0.102
layers = "F.Cu F.Mask F.Paste"

[[pin]]
num = 6
number = "6"
name = "RTN"
purpose = "Return"
notes = "Negative rail input to the dc/dc converter and output of the PoE hotswap. Treat as a local ground reference plane. RTN current 350 mA max for TJ <= 125 C."
