pad_shape = "roundrect"
roundrect_rratio = 0.125
solder_mask_margin = 0.102
layers = "F.Cu F.Mask F.Paste"

[[pin]]
num = 11
number = "11"
name = "CLS"
purpose = "Classification"
notes = "Connect a resistor from CLS to VSS to program the classification current. RCLS values 1270, 243, 137 and 90.9 Ohm select PD classes 0-3; the output is disabled when APD is above VAPDEN."
kind = "dio"
pos = [2.87, 0.0]
rotation = 0.0
length = 1.57
width = 1.57
height = 0.41
pad_type = "smd"
pad_shape = "roundrect"
roundrect_rratio = 0.125
solder_mask_margin = 0.102
layers = "F.Cu F.Mask F.Paste"

[[pin]]
num = 12
number = "12"
name = "APD"
purpose = "Adapter detect"
notes = "Pull APD above VAPDEN (~1.5 V) to disable the internal PD hotswap switch, forcing power to come from an external adapter; connect to the adapter through a resistor divider. Tie APD to RTN when not used."
kind = "dio"
pos = [2.87, -0.65]
rotation = 0.0
length = 1.57
width = 1.57
height = 0.41
