solder_mask_margin = 0.102
layers = "F.Cu F.Mask F.Paste"

[[pin]]
num = 10
number = "10"
name = "DEN"
purpose = "Detection"
notes = "Connect a 24.9 kOhm resistor from DEN to VDD to provide the PoE detection signature. Pulling DEN to VSS during powered operation turns off the internal hotswap MOSFET and class regulator. Hotswap disable threshold VPD_DIS 3-5 V."
kind = "dio"
pos = [2.87, 0.65]
rotation = 0.0
length = 1.57
width = 1.57
height = 0.41
