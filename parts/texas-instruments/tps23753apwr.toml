[[pin]]
num = 9
number = "9"
name = "VDD"
purpose = "Supply"
notes = "Positive input power rail for the PoE interface circuit, derived from the PoE source. Bypass to VSS with a 0.1 uF (X7R, 10%) capacitor and protect with a transient suppressor (Zener) diode. Input voltage range 0-57 V."
kind = "pwr"
v_min = 0.0
v_max = 57.0
i_max = 0.35
pos = [2.87, 1.3]
