[component]
name = "Tps23753apwr"
title = "Texas Instruments TPS23753APWR IEEE 802.3at PoE Interface and Converter Controller with Enhanced ESD Immunity (TSSOP-14)"
datasheet = "https://www.ti.com/lit/ds/symlink/tps23753a.pdf"
