pos = [-2.87, 1.3]
rotation = 0.0
length = 1.57
width = 1.57
height = 0.41
pad_type = "smd"
pad_shape = "roundrect"
roundrect_rratio = 0.125
solder_mask_margin = 0.102
layers = "F.Cu F.Mask F.Paste"

[[pin]]
num = 7
number = "7"
name = "VSS"
purpose = "Ground"
notes = "Negative power rail derived from the PoE source and reference for the PoE interface circuits. Clamped to a diode drop above RTN by the hotswap switch."
kind = "gnd"
pos = [-2.87, 1.95]
rotation = 0.0
length = 1.57
width = 1.57
height = 0.41
pad_type = "smd"
pad_shape = "roundrect"
