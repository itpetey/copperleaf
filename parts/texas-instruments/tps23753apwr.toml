[[pin]]
num = 8
number = "8"
name = "VDD1"
purpose = "Startup supply"
notes = "Source of dc/dc converter startup current; connect to VDD for most applications. May be isolated by a diode from VDD to support PoE priority operation. Input voltage range 0-57 V."
kind = "pwr"
v_min = 0.0
v_max = 57.0
i_max = 0.35
pos = [2.87, 1.95]
rotation = 0.0
length = 1.57
