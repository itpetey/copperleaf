[package]
name = "copperleaf-parts-wurth-elektronik"
version.workspace = true
edition.workspace = true
description = "wurth-elektronik vendor components"
license.workspace = true
publish.workspace = true

[package.metadata.cargo-shear]
# `copperleaf` is referenced by `build_component!`-generated code, which
# cargo-shear cannot see, so it is a real dependency despite the false
# positive.
ignored = ["copperleaf"]

[lib]
path = "lib.rs"

[dependencies]
copperleaf.workspace = true
copperleaf-part-macro.workspace = true
